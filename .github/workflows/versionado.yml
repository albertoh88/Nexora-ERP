name: Auto Tag Version

on:
  push:
    branches:
      - main # Cambia a 'master' si tu rama principal se llama así

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Descarga el código
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Trae todo el historial para calcular la versión

      # 2. Crea la versión y la etiqueta automáticamente
      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.75.0 # Versión estable de esta acción
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_PREFIX: v
          # Dejamos que si no encuentra ninguna palabra, no suba versión
          DEFAULT_BUMP: none
